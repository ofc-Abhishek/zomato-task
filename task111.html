<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devi  ce-width, initial-scale=1.0">
    <title>Zomato</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0;">
    
    <header style="background-color: #e23744; padding: 15px; text-align: center; color: white; font-size: 24px; font-weight: bold;">
        Zomato
    </header>
    
    <nav style="background-color: #fff; padding: 10px; text-align: center;">
        <a href="#" style="margin: 0 15px; text-decoration: none; color: #e23744; font-weight: bold;">Home</a>
        <a href="#" style="margin: 0 15px; text-decoration: none; color: #e23744; font-weight: bold;">Restaurants</a>
        <a href="#" style="margin: 0 15px; text-decoration: none; color: #e23744; font-weight: bold;">Contact</a>
    </nav>
    
    <img src="C:\Users\Dhiraj-Jadha\Downloads\zomato.jpg"" alt="Zomato Banner" style="width: 100%; max-height: 400px;">
    
    <div style="text-align: center; padding: 20px;">
        <h2 style="color: #e23744;">Find the best restaurants, cafés, and bars</h2>
        <input type="text" placeholder="Search for restaurants..." style="padding: 10px; width: 60%; max-width: 500px; border: 1px solid #ccc; border-radius: 5px;">
        <button style="background-color: #e23744; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-left: 10px;">Search</button>
    </div>
    
    <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; padding: 20px;">
        <div style="background-color: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 250px; text-align: center;">
            <img src="https://www.example.com/restaurant.jpg" alt="Restaurant" style="width: 100%; border-radius: 10px;">
            <h3>Restaurant Name</h3>
            <p>Delicious food and great ambiance</p>
            <button onclick="navigateToZomato()" style="background-color: #e23744; color: white; border: none; padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 5px;">View</button>
        </div>
    </div>
    
    <div style="text-align: center; margin: 20px;">
        <button onclick="navigateToZomato()" style="background-color: #e23744; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px;">Order Now</button>
    </div>
    
    <footer style="background-color: #e23744; padding: 15px; text-align: center; color: white; font-size: 14px;">
        © 2025 Zomato  | All Rights Reserved
    </footer>
    
    <script>
        function navigateToZomato() {
            window.open("https://www.zomato.com", "_blank");
        }
    </script>
</body>
</html>
